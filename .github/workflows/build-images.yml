name: Build images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: build-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tested production images
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/midfinup1/li-polesh-store-backend
            build_args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/midfinup1/li-polesh-store-frontend
            build_args: |
              NEXT_PUBLIC_API_URL=/api/v1
              NEXT_PUBLIC_SITE_URL=https://lipolesh.art
              NEXT_IMAGE_REMOTE_HOSTS=s3.twcstorage.ru,3mjjbew73k.cdn.twcstorage.ru
          - name: caddy
            context: ./infra/caddy
            file: ./infra/caddy/Dockerfile
            image: ghcr.io/midfinup1/li-polesh-store-caddy
            build_args: ""

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
