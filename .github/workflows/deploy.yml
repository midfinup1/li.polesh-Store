name: Deploy production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      rollback_sha:
        description: "Commit SHA for rollback. Required only for rollback."
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested commit to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'deploy' }}

    steps:
      - name: Deploy exact commit over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/li-polesh-store

            DEPLOY_SHA="${{ github.sha }}"
            echo "Deploying tested images for $DEPLOY_SHA"

            echo "Creating database backup before deploy..."
            ./scripts/backup-postgres.sh

            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            ./scripts/install-backup-cron.sh

            export IMAGE_TAG="$DEPLOY_SHA"

            echo "Pull exact images..."
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml pull

            echo "Restart production services..."
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml ps

  rollback:
    name: Roll back VPS to exact commit
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'rollback' }}

    steps:
      - name: Check rollback SHA
        run: |
          if ! printf '%s' "${{ github.event.inputs.rollback_sha }}" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "rollback_sha must be a Git commit SHA"
            exit 1
          fi

      - name: Roll back exact images over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/li-polesh-store

            ROLLBACK_SHA="${{ github.event.inputs.rollback_sha }}"
            echo "Rolling back to $ROLLBACK_SHA"

            echo "Creating database backup before rollback..."
            ./scripts/backup-postgres.sh

            git fetch origin
            git reset --hard "$ROLLBACK_SHA"

            export IMAGE_TAG="$ROLLBACK_SHA"

            echo "Pull rollback images..."
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml pull

            echo "Restart services with rollback images..."
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml ps
